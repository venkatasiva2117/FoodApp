<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foodie Registration</title>
<style>
/* ---------------- Global Styles ---------------- */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(120deg, #ff6b6b, #feca57);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

/* ---------------- Background Food Animation ---------------- */
@keyframes floatFood {
  0% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
  50% { transform: translateY(-30px) rotate(15deg); opacity: 1; }
  100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
}

.food-bg {
  position: absolute;
  font-size: 40px;
  opacity: 0.1;
  animation: floatFood 4s ease-in-out infinite;
  user-select: none;
}

.food-bg:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
.food-bg:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; }
.food-bg:nth-child(3) { bottom: 15%; left: 20%; animation-delay: 2s; }
.food-bg:nth-child(4) { bottom: 10%; right: 10%; animation-delay: 3s; }

/* ---------------- Form Container ---------------- */
.container {
  position: relative;
  background: rgba(255, 255, 255, 0.95);
  padding: 30px 40px;
  border-radius: 20px;
  width: 400px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  animation: slideUp 1s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

.container h2 {
  text-align: center;
  color: #ff6b6b;
  margin-bottom: 20px;
  font-weight: 700;
  letter-spacing: 1px;
}

/* ---------------- Form Elements ---------------- */
form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

label {
  font-weight: 600;
  color: #555;
}

input, select {
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  outline: none;
  font-size: 14px;
  transition: all 0.3s ease;
}

input:focus, select:focus {
  border-color: #ff6b6b;
  box-shadow: 0 0 5px rgba(255, 107, 107, 0.6);
}

/* ---------------- Buttons ---------------- */
button {
  background: #ff6b6b;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  transition: all 0.3s ease;
}

button:hover {
  background: #ff4757;
  transform: scale(1.05);
}

/* ---------------- Second Form ---------------- */
.details {
  margin-top: 25px;
  text-align: center;
}

.details h3 {
  color: #ff6b6b;
  margin-bottom: 10px;
}

@media (max-width: 450px) {
  .container { width: 90%; }
}
</style>
</head>
<body>

<!-- 🍕 Background Food Icons -->
<div class="food-bg">🍕</div>
<div class="food-bg">🍔</div>
<div class="food-bg">🍟</div>
<div class="food-bg">🥗</div>

<!-- 🥗 Registration Form -->
<div class="container">
  <h2>🍔 Registration Form</h2>
  <form action="UserConnection">
    <label>Name</label>
    <input type="text" name="name" placeholder="Enter your name" required>

    <label>Username</label>
    <input type="text" name="username" placeholder="Enter username" required>

    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password" required>

    <label>Email</label>
    <input type="email" name="email" placeholder="Enter email" required>

    <label>Phone Number</label>
    <input type="number" name="number" placeholder="Enter phone number" required>

    <label>Address</label>
    <input type="text" name="address" placeholder="Enter address" required>

    <label>Role</label>
    <select name="role" required>
      <option value="USER">USER</option>
      <option value="ADMIN">ADMIN</option>
    </select>

    <button type="submit">Register</button>
  </form>


</div>

</body>
</html>
