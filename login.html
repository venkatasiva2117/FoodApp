<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foodie Login</title>
<style>
/* ---------- Global Styles ---------- */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(120deg, rgba(255,107,107,0.8), rgba(255,195,113,0.9)),
              url('https://www.vecteezy.com/video/25400554-mutton-biryani-meal-in-a-bowl-on-table') no-repeat center center/cover;
  backdrop-filter: blur(2px);
  animation: bgMove 15s linear infinite alternate;
}

@keyframes bgMove {
  from { background-position: center top; }
  to { background-position: center bottom; }
}

/* ---------- Floating Food Emojis ---------- */
.food {
  position: absolute;
  font-size: 40px;
  opacity: 0.15;
  animation: floatFood 6s ease-in-out infinite;
  user-select: none;
}

.food:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
.food:nth-child(2) { top: 20%; right: 12%; animation-delay: 1s; }
.food:nth-child(3) { bottom: 15%; left: 15%; animation-delay: 2s; }
.food:nth-child(4) { bottom: 10%; right: 10%; animation-delay: 3s; }

@keyframes floatFood {
  0% { transform: translateY(0px) rotate(0deg); opacity: 0.15; }
  50% { transform: translateY(-25px) rotate(15deg); opacity: 0.25; }
  100% { transform: translateY(0px) rotate(0deg); opacity: 0.15; }
}

/* ---------- Login Box ---------- */
.login-container {
  background: rgba(255,255,255,0.95);
  padding: 35px 40px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  width: 360px;
  text-align: center;
  animation: slideUp 1s ease;
  position: relative;
  z-index: 2;
  transition: transform 0.4s ease;
}

.login-container:hover {
  transform: translateY(-5px) scale(1.02);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(50px); }
  to { opacity: 1; transform: translateY(0); }
}

h2 {
  color: #ff6b6b;
  font-weight: 700;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

/* ---------- Input Fields ---------- */
input[type="text"], input[type="password"] {
  width: 100%;
  padding: 12px;
  margin: 10px 0 20px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  transition: all 0.3s ease;
  font-size: 14px;
}

input:focus {
  border-color: #ff6b6b;
  box-shadow: 0 0 6px rgba(255,107,107,0.6);
  outline: none;
}

/* ---------- Button ---------- */
button {
  width: 100%;
  padding: 12px;
  background-color: #ff6b6b;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  transition: all 0.3s ease;
}

button:hover {
  background-color: #ff4757;
  transform: scale(1.05);
  box-shadow: 0 4px 10px rgba(255,107,107,0.4);
}

/* ---------- Register Link ---------- */
.register-link {
  margin-top: 15px;
  font-size: 14px;
}

.register-link a {
  text-decoration: none;
  color: #ff6b6b;
  font-weight: bold;
}

.register-link a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>
<!-- 🍔 Floating Emojis -->
<div class="food">🍔</div>
<div class="food">🍕</div>
<div class="food">🍟</div>
<div class="food">🥗</div>

<!-- 🥗 Login Form -->
<div class="login-container">
  <h2>Welcome Back 🍕</h2>
  <form action="LoginConnection" id="login-form" method="post">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <div class="register-link">
    New user? <a href="registerpage.html">Register here</a>
  </div>
</div>

</body>
</html>
