<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Confirmed</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #b2fefa, #0ed2f7);
        font-family: "Poppins", sans-serif;
        overflow: hidden;
      }

      .card {
        background: #fff;
        padding: 40px 60px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        animation: fadeInUp 1s ease;
        position: relative;
        z-index: 10;
      }

      @keyframes fadeInUp {
        0% {
          transform: translateY(50px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .checkmark {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        display: inline-block;
        border: 6px solid #4caf50;
        position: relative;
        animation: pop 0.6s ease forwards;
      }

      .checkmark::after {
        content: "";
        position: absolute;
        left: 55px;
        top: 20px;
        width: 25px;
        height: 60px;
        border-right: 6px solid #4caf50;
        border-bottom: 6px solid #4caf50;
        transform: rotate(45deg) scale(0);
        transform-origin: left top;
        animation: draw 0.6s 0.5s ease forwards;
      }

      @keyframes pop {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes draw {
        0% {
          transform: rotate(45deg) scale(0);
        }
        100% {
          transform: rotate(45deg) scale(1);
        }
      }

      h1 {
        font-size: 2em;
        color: #333;
        margin-top: 25px;
      }

      p {
        color: #666;
        font-size: 1.1em;
        margin: 8px 0 20px;
      }

      .btn {
        background: #4caf50;
        color: #fff;
        padding: 12px 30px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: 0.3s;
      }
      .btn:hover {
        background: #43a047;
        transform: scale(1.05);
      }

      /* Confetti animation */
      .confetti {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }
      .confetti span {
        position: absolute;
        width: 10px;
        height: 10px;
        background: var(--c);
        animation: fall 4s linear infinite;
        opacity: 0.8;
      }

      @keyframes fall {
        0% {
          transform: translateY(-10px) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="confetti" id="confetti"></div>

    <div class="card">
      <div class="checkmark"></div>
      <h1>Order Confirmed!</h1>
      <p>Your delicious food is being prepared and will reach you soon.</p>
      <a href="home" class="btn">Back to Menu</a>
    </div>

    <script>
      // Confetti generation
      const confetti = document.getElementById("confetti");
      const colors = ["#ff7675", "#74b9ff", "#55efc4", "#ffeaa7", "#fd79a8"];
      for (let i = 0; i < 50; i++) {
        const piece = document.createElement("span");
        piece.style.setProperty(
          "--c",
          colors[Math.floor(Math.random() * colors.length)]
        );
        piece.style.left = Math.random() * 100 + "%";
        piece.style.animationDelay = Math.random() * 4 + "s";
        piece.style.width = piece.style.height = Math.random() * 8 + 6 + "px";
        confetti.appendChild(piece);
      }
    </script>
  </body>
</html>
